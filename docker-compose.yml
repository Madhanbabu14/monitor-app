version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pcc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pipeline_control_center}
      POSTGRES_USER: ${POSTGRES_USER:-pcc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcc_password}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seeds/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pcc_user} -d ${POSTGRES_DB:-pipeline_control_center}']
      interval: 10s
      timeout: 5s
      retries: 5

  # The legacy Node/Express backend is NOT built from this repo (its source
  # lives in the original monorepo and is deployed independently during the
  # strangler window — see "Remove Node.js backend" in this repo's history).
  # Run it separately (e.g. `cd backend && npm run dev`, or its own compose
  # file / container image) and point LEGACY_BACKEND_URL at wherever it
  # ends up listening; the gateway's "legacy" cluster destination below
  # defaults to the same http://localhost:4001 the frontend used to talk to
  # directly in dev.
  #
  # Monitor.Api (this repo's replacement backend) has no route groups
  # mapped yet as of this slice, so it is not wired into the gateway here
  # either — a later slice adds a `monitor-api` service once it has
  # endpoints to serve, and flips the relevant ReverseProxy routes in
  # src/Monitor.Gateway/appsettings.json from the "legacy" cluster to the
  # "dotnet" cluster.
  gateway:
    build:
      context: .
      dockerfile: src/Monitor.Gateway/Dockerfile
    container_name: pcc-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Gateway__Port: '8080'
      ReverseProxy__Clusters__legacy__Destinations__destination1__Address: ${LEGACY_BACKEND_URL:-http://host.docker.internal:4001/}
    ports:
      - '8080:8080'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Points at the gateway, not at either backend directly — see
        # frontend/src/services/api.ts, which reads this as its axios
        # baseURL.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
        VITE_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
        VITE_AZURE_TENANT_ID: ${AZURE_TENANT_ID}
    container_name: pcc-frontend
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - '3000:80'

volumes:
  postgres_data:
